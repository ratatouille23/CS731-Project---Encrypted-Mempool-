[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shielded-mempool-research"
version = "0.3.0"
description = "Research prototype: threshold-encrypted mempool, attack reproduction, distributed benchmarking, and transaction-linkage experiments"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.7"]

[project.scripts]
shielded-mempool = "shielded_mempool.cli:main"

[tool.setuptools.packages.find]
include = ["shielded_mempool*"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
testpaths = ["tests"]
markers = ["integration: starts a real multi-process committee"]
